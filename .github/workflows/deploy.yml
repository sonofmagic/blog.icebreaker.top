name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
  # add webhook
  repository_dispatch:
    types:
      - webhook
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Self Repo
        uses: actions/checkout@v7.0.1
        with:
          submodules: 'true'
          ssh-key: ${{ secrets.SSH_KEY }}
      - uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync Articles
        working-directory: blog
        run: pnpm sync
      - name: Build Site
        working-directory: blog
        run: pnpm generate
      - name: Validate deployment bundle
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3

        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.145.0
          command: deploy
      - name: print deployment-url
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo $DEPLOYMENT_URL
